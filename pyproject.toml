[project]
name = "permissiondiff"
version = "0.1.1"
description = "Deterministic differential authorization regression testing"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abishek Giri" }]
keywords = [
    "authorization",
    "ci",
    "differential-testing",
    "property-based-testing",
    "security-testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "hypothesis>=6.100",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/abishekgiri/permissiondiff"
Repository = "https://github.com/abishekgiri/permissiondiff"
Issues = "https://github.com/abishekgiri/permissiondiff/issues"
Changelog = "https://github.com/abishekgiri/permissiondiff/blob/main/CHANGELOG.md"
Security = "https://github.com/abishekgiri/permissiondiff/security/policy"

[project.scripts]
permissiondiff = "permissiondiff.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["permissiondiff"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
